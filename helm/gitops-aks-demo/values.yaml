replicaCount: 2

image:
  repository: ghcr.io/saquibfarash24/gitops-aks-demo
  pullPolicy: IfNotPresent
  tag: "0a345e2933a890130a33c33b75aa45b0c3ea0894"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

containerPort: 8081

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20


monitoring:
  serviceMonitor:
    enabled: true
  alerts:
    enabled: true
